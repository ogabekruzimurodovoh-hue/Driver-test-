<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Truck inspection</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="btn btn-ghost btn-sm" id="backBtn" type="button" aria-label="Previous step">‹ Back</button>
    <div class="topbar-title" id="title">Inspection</div>
    <div class="muted small" id="counter" style="min-width:48px;text-align:right"></div>
  </header>
  <div class="progress" aria-hidden="true"><div id="bar"></div></div>

  <main class="wrap narrow" id="app" style="padding-bottom:120px">
    <div class="card"><span class="spinner" aria-label="Loading"></span></div>
  </main>

  <footer class="bottombar">
    <button class="btn btn-ghost" id="prevBtn" type="button">Back</button>
    <button class="btn" id="nextBtn" type="button">Continue</button>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/js/common.js"></script>
  <script src="/js/inspect.js"></script>
</body>
</html>
